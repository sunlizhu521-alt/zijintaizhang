name: Verify and Deploy Zijintaizhang

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zijintaizhang-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: x64
          check-latest: true
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Package verified release with isolated Node runtime
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          export RELEASE_STAGE="$RUNNER_TEMP/zijintaizhang-$GITHUB_SHA"
          mkdir -p "$RELEASE_STAGE/runtime"
          cp -R dist server shared scripts node_modules "$RELEASE_STAGE/"
          cp package.json package-lock.json ecosystem.config.cjs "$RELEASE_STAGE/"
          rm -rf "$RELEASE_STAGE/node_modules/.bin"
          if [ -n "$(find "$RELEASE_STAGE" -type l -print -quit)" ]; then
            echo 'Release packages must not contain symbolic links.' >&2
            exit 1
          fi
          cp "$(node -p 'process.execPath')" "$RELEASE_STAGE/runtime/node"
          chmod 755 "$RELEASE_STAGE/runtime/node"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const stage = process.env.RELEASE_STAGE;
          const manifest = {
            commit: process.env.GITHUB_SHA, nodeVersion: process.version,
            platform: process.platform, arch: process.arch,
            runtimeSha256: createHash('sha256').update(fs.readFileSync(path.join(stage, 'runtime/node'))).digest('hex'),
          };
          if (manifest.platform !== 'linux' || manifest.arch !== 'x64') throw new Error('Expected Linux x64 build runner');
          fs.writeFileSync(path.join(stage, 'release.json'), JSON.stringify(manifest) + '\n');
          NODE
          tar -czf "$RUNNER_TEMP/zijintaizhang-$GITHUB_SHA.tar.gz" -C "$RELEASE_STAGE" \
            dist server shared scripts node_modules runtime package.json package-lock.json ecosystem.config.cjs release.json
      - name: Upload verified deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: release-artifact
        uses: actions/upload-artifact@v7
        with:
          name: zijintaizhang-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zijintaizhang-${{ github.sha }}.tar.gz
          compression-level: 0
          archive: true
          retention-days: 1
          if-no-files-found: error
      - name: Deploy artifact through restricted SSH receiver
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.release-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.release-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          key="$RUNNER_TEMP/zijintaizhang-deploy-key"
          known_hosts="$RUNNER_TEMP/zijintaizhang-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          export DEPLOY_KEY_PATH="$key" DEPLOY_HOSTS_PATH="$known_hosts"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const env = process.env;
          if (!/^\d+$/.test(env.ARTIFACT_ID || '') || !/^[\w.-]+\/[\w.-]+$/.test(env.GITHUB_REPOSITORY || '')) throw new Error('Invalid artifact metadata');
          const file = `${env.RUNNER_TEMP}/zijintaizhang-${env.GITHUB_SHA}.tar.gz`;
          const size = fs.statSync(file).size;
          const tgzSha256 = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const zipSha256 = (env.ARTIFACT_DIGEST || '').replace(/^sha256:/, '');
          if (!/^[a-f0-9]{64}$/.test(zipSha256) || size <= 0 || size > 128 * 1024 * 1024) throw new Error('Invalid artifact digest or size');
          const childEnv = { ...env };
          delete childEnv.GH_TOKEN;
          delete childEnv.DEPLOY_SSH_KEY;
          let deployed = false;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const response = await fetch(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/artifacts/${env.ARTIFACT_ID}/zip`, {
                headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
                redirect: 'manual', signal: AbortSignal.timeout(10000),
              });
              if (response.status !== 302) throw new Error('Artifact URL unavailable');
              const url = response.headers.get('location');
              const parsed = new URL(url);
              if (parsed.protocol !== 'https:' || parsed.username || parsed.password || parsed.hash ||
                  (parsed.port && parsed.port !== '443') || !/^productionresultssa[0-9]{1,5}\.blob\.core\.windows\.net$/.test(parsed.hostname)) throw new Error('Unapproved artifact host');
              const manifest = JSON.stringify({ version: 1, commit: env.GITHUB_SHA, url, zipSha256, tgzSha256, size });
              if (Buffer.byteLength(manifest) > 16384) throw new Error('Artifact manifest is too large');
              const result = spawnSync('ssh', ['-i', env.DEPLOY_KEY_PATH, '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes',
                '-o', 'StrictHostKeyChecking=yes', '-o', `UserKnownHostsFile=${env.DEPLOY_HOSTS_PATH}`, '-o', 'ConnectTimeout=15',
                '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=3', `${env.DEPLOY_USER}@${env.DEPLOY_HOST}`, `deploy ${env.GITHUB_SHA}`],
                { input: manifest, stdio: ['pipe', 'inherit', 'inherit'], env: childEnv, timeout: 1320000 });
              if (result.status === 0) { deployed = true; break; }
            } catch {
              // Never print fetch errors or the signed download URL.
            }
            console.error(`Deployment attempt ${attempt}/3 failed; the next attempt requests a fresh download URL.`);
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!deployed) process.exit(1);
          NODE
      - name: Verify public HTTPS release and homepage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --retry 3 \
            'https://129.211.9.242/zijintaizhang/api/health' > "$RUNNER_TEMP/zijintaizhang-health.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/zijintaizhang-health.json`, 'utf8'));
          if (health.status !== 'ok' || health.app !== 'zijintaizhang' || health.release !== process.env.GITHUB_SHA) throw new Error('Public release health check failed');
          NODE
          curl --fail --silent --show-error --max-time 15 \
            'https://129.211.9.242/zijintaizhang/' > "$RUNNER_TEMP/zijintaizhang-home.html"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync(`${process.env.RUNNER_TEMP}/zijintaizhang-home.html`, 'utf8');
          if (!html.includes('<title>资金台账</title>') || !html.includes('/zijintaizhang/assets/')) throw new Error('Public homepage check failed');
          NODE
